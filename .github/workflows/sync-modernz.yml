name: Sync ModernZ Source

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: linux

      - name: Download latest ModernZ files
        run: |
          curl -sSL "https://raw.githubusercontent.com/Samillion/ModernZ/main/modernz.lua" -o scripts/modernz.lua
          curl -sSL "https://raw.githubusercontent.com/Samillion/ModernZ/main/modernz.conf" -o script-opts/modernz.conf
          curl -sSL "https://raw.githubusercontent.com/Samillion/ModernZ/main/modernz-icons.ttf" -o fonts/modernz-icons.ttf
      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add scripts/modernz.lua script-opts/modernz.conf fonts/modernz-icons.ttf

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync ModernZ files with upstream"
            git push
          else
            echo "No changes detected."
          fi
