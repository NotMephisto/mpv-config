name: Sync ModernZ Script

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: linux

      - name: Download latest modernz.lua
        run: |
          curl -sSL "https://raw.githubusercontent.com/Samillion/ModernZ/main/modernz.lua" -o scripts/modernz.lua

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/modernz.lua
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync modernz.lua with upstream"
            git push
          else
            echo "No changes detected."
          fi
